name: Test, Build & Create PR to main

on:
  push:
    branches:
      - k8s

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx

      - name: Run linter (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        env:
          PROJECT_NAME: "Kinootziv"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "test"
          POSTGRES_PASSWORD: "test"
          POSTGRES_DB: "test"
        run: pytest tests/ -v

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      worker: ${{ steps.filter.outputs.worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            worker:
              - 'worker/**'
            frontend:
              - 'frontend/**'

  build-backend:
    needs: [lint-and-test, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: kinootziv
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            fklska/kino-backend:1.0
            fklska/kino-backend:latest
            ghcr.io/${{ github.repository_owner }}/kino-backend:1.0
            ghcr.io/${{ github.repository_owner }}/kino-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-worker:
    needs: [lint-and-test, changes]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    environment: kinootziv
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            fklska/bert-worker:1.0
            fklska/bert-worker:latest
            ghcr.io/${{ github.repository_owner }}/bert-worker:1.0
            ghcr.io/${{ github.repository_owner }}/bert-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  build-frontend:
    needs: [lint-and-test, changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: kinootziv
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            fklska/kino-frontend:1.0
            fklska/kino-frontend:latest
            ghcr.io/${{ github.repository_owner }}/kino-frontend:1.0
            ghcr.io/${{ github.repository_owner }}/kino-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  create-pr:
    needs: [lint-and-test, build-backend, build-worker, build-frontend]
    if: always() && needs.lint-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR k8s -> main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          commits_ahead=$(git rev-list --count origin/main..origin/k8s)
          echo "Commits ahead: $commits_ahead"
          
          if [ "$commits_ahead" -gt 0 ]; then
            existing=$(gh pr list --base main --head k8s --state open --json number --jq 'length')
            if [ "$existing" -eq 0 ]; then
              gh pr create \
                --base main \
                --head k8s \
                --title "Auto PR: k8s → main" \
                --body "Автоматический PR после успешного прохождения тестов и сборки образов."
            else
              echo "Pull request already exists, skipping creation."
            fi
          else
            echo "No new commits in k8s, skipping PR creation."
          fi