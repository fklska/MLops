apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-nginx
  namespace: kinootziv-app
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
spec:
  rules:
  - host: adminer.fklska.asuscomm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: adminer-svc
            port:
              number: 8080

  - host: backend.fklska.asuscomm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kinootziv-svc
            port:
              number: 8000
  
  - host: mlflow.fklska.asuscomm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mlflow-svc
            port:
              number: 5000

  - host: minio.fklska.asuscomm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio-svc
            port:
              number: 9001
  
  - host: minioapi.fklska.asuscomm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio-svc
            port:
              number: 9000
  
  - host: grafana.fklska.asuscomm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-svc
            port:
              number: 3000
  
  - host: prometheus.fklska.asuscomm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-svc
            port:
              number: 9090