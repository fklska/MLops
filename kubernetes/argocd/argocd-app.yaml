apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kinootziv-app
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: 'https://github.com/fklska/MLops.git'
    targetRevision: main
    path: kubernetes/
    
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kinootziv-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true