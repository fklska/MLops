apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidently-ui
  namespace: kinootziv-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evidently-ui
  template:
    metadata:
      labels:
        app: evidently-ui
    spec:
      containers:
      - name: evidently-container
        image: fklska/kino-drift:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 7888
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "100m"
        volumeMounts:
        - name: logs-storage
          mountPath: /app/logs
      volumes:
      - name: logs-storage
        persistentVolumeClaim:
          claimName: worker-logs-pvc