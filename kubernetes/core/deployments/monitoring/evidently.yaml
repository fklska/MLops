apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidently-ui
  namespace: kinootziv-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evidently-ui
  template:
    metadata:
      labels:
        app: evidently-ui
    spec:
      containers:
      - name: evidently-container
        image: fklska/kino-drift:1.69
        imagePullPolicy: Always
        ports:
        - containerPort: 7888
        envFrom:
          - configMapRef:
              name: postgres-cm
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "2048Mi"
            cpu: "500m"