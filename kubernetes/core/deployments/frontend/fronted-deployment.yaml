apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kinootziv-app
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: fklska/kino-frontend:1.0
        resources:
          limits:
            memory: "128Mi"
            cpu: "300m"
        ports:
        - containerPort: 80