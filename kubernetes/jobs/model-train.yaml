apiVersion: batch/v1
kind: Job
metadata:
  name: bert-train
  namespace: kinootziv-app
  annotations:
    argocd.argoproj.io/hook: Manual
    argocd.argoproj.io/sync-options: Prune=false
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      containers:
      - name: trainer
        image: fklska/bert-worker:1.44
        imagePullPolicy: Always
        command: ["python3", "train.py"]
        envFrom:
          - configMapRef:
              name: worker-cm
        resources:
          limits:
            cpu: "1000m"
            memory: "8Gi"

      restartPolicy: Never
