apiVersion: batch/v1
kind: Job
metadata:
  name: regmodel
  annotations:
    argocd.argoproj.io/hook: Manual
    argocd.argoproj.io/sync-options: Prune=false
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      containers:
      - name: worker-regmodel
        image: fklska/bert-worker:1.44
        imagePullPolicy: Always
        command: ["python3", "register.py"]
        envFrom:
        - configMapRef:
            name: worker-cm 
      restartPolicy: Never
