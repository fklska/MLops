apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kinootziv-app
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:18-alpine
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init-db
          mountPath: /docker-entrypoint-initdb.d
        envFrom:  
        - configMapRef:
            name: postgres-cm
      
      volumes:
      - name: init-db
        configMap:
          name: postgres-cm
