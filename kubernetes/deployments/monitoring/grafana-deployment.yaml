apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: kinootziv-app
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:nightly-slim
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000

        envFrom:
        - configMapRef:
            name: grafana-cm

        volumeMounts:
        - name: grafana-pv
          mountPath: /var/lib/grafana
        - name: datasourses
          mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
          subPath: datasource.yaml


      volumes:
      - name: grafana-pv
        persistentVolumeClaim:
          claimName: grafana-pvc
      - name: datasourses
        configMap:
          name: grafana-cm