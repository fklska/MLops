apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cm
  namespace: kinootziv-app
data:
  GF_SERVER_ROOT_URL: "https://fklska.asuscomm.com/grafana"
  GF_SERVER_SERVE_FROM_SUB_PATH: "true"
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-svc:9090
        isDefault: true
