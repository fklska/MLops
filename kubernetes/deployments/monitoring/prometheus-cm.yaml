apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-cm
  namespace: kinootziv-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 60s

    scrape_configs:
    - job_name: 'node-exporter'
      static_configs:
        - targets: ['192.168.49.2:9100']
    - job_name: 'bert-metrics'
      static_configs:
        - targets: ['worker-svc:8088']
